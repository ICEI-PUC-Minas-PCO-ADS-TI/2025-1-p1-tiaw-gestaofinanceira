      <h2>Controle sua vida financeira com mais inteligência.</h2>

    </div>
    <div id="login">
        <h2>Smart Finance</h2>
        <nav>
          <ul>
            <li >
              <div class="bg-nav"> 
                <a href="login.html">
                  Login

        <form id="novo-usuario">
            <div class="form-group">
                    <label for="login">Usuário</label><br>
                    <input type="text" name="txt_login" id="txt_login" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="nome">Nome completo</label><br>
                <input type="text" name="txt_nome" id="txt_nome" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label><br>
                <input type="text" name="txt_email" id="txt_email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label><br>
                <input type="password" name="txt_senha" id="txt_senha" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="senha2">Confirmação de Senha</label><br>
                <input type="password" name="txt_senha2" id="txt_senha2" class="form-control" required>
            </div>
            <div>
              <button id="btn_salvar" class="btnLogin"> CRIAR CONTA</button>
            </div>
        </form>
    </div>
  </div>

  <script src="./assets/js/login.js"></script>
  <script>
        function salvaLogin (event) {
            // Cancela a submissão do formulário para tratar sem fazer refresh da tela
            event.preventDefault ();
            const formLogin = document.getElementById('novo-usuario');
            if (!formLogin.checkValidity()) {
                alert("Preencha o formulário corretamente.");
                return;
            }

            // Obtem os dados do formulário
            let login  = document.getElementById('txt_login').value;
            let nome   = document.getElementById('txt_nome').value;
            let email  = document.getElementById('txt_email').value;
            let senha  = document.getElementById('txt_senha').value;
            let senha2 = document.getElementById('txt_senha2').value;
            if (senha != senha2) {
                alert ('As senhas informadas não conferem.');
                return
            }

            // Adiciona o usuário no banco de dados
            addUser (nome, login, senha, email);
            alert ('Usuário salvo com sucesso. Proceda com o login para ');

            // Oculta a div modal do login
            //document.getElementById ('loginModal').style.display = 'none';
            $('#loginModal').modal('hide');
        }


        // Associar salvamento ao botao
        const btnSalvarLogin = document.getElementById ('btn_salvar');
        btnSalvarLogin.addEventListener ('click', ()=>{
          console.log('Salvando novo usuário');
          const formLogin = document.getElementById('novo-usuario');
            if (!formLogin.checkValidity()) {
                alert("Preencha o formulário corretamente.");
                return;
            }
            salvaLogin(event);
        });        

      
    </script>
